[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semd-ml"
version = "0.1.0"
description = "SEMD malicious URL ML pipeline"
requires-python = ">=3.12"
dependencies = [
  "imbalanced-learn>=0.12.0",
  "joblib>=1.3.0",
  "matplotlib>=3.7.0",
  "numpy>=1.24.0",
  "openpyxl>=3.1.5",
  "pandas>=1.3.5",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "PyYAML>=6.0.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.11.0",
  "idna>=3.11",
  "psycopg2-binary>=2.9.9",
  "redis>=5.0.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=3.2.0"]
tracking = ["mlflow>=3.10.0", "mlflow-tracing>=3.10.0"]

[project.scripts]
semd-ml = "cli.bootstrap:run"

[dependency-groups]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pytest>=8.0.0",
  "pandas-stubs>=2.0.0",
  "types-PyYAML>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["playground", "dataset/script"]
