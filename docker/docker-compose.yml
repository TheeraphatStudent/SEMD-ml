version: '3.8'

services:
  ml-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: semd-ml-service
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgreSQL}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
      POSTGRES_DB: ${POSTGRES_DB:-semd}
      MLFLOW_TRACKING_URI: ${MLFLOW_CONTAINER_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-semd-url-classification}
      MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-semd-malicious-url-detector}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-./artifacts/mlflow}
    volumes:
      - ../models:/app/models
      - ../reports:/app/reports
      - ../dataset:/app/dataset
      - ../artifacts:/app/artifacts
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - semd-shared-network
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.0
    container_name: semd-mlflow
    ports:
      - "5000:5000"
    working_dir: /
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=${MLFLOW_ARTIFACT_ROOT:-./artifacts/mlflow}
      - --serve-artifacts
      - --registry-store-uri=sqlite:////mlflow/mlflow.db
      - --allowed-hosts=*
      - --cors-allowed-origins=*
    volumes:
      - ../mlflow_data:/mlflow
      - ../artifacts:/artifacts
    networks:
      - semd-shared-network
    restart: unless-stopped
    environment:
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-./artifacts/mlflow}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  semd-shared-network:
    name: semd-shared-network
    driver: bridge
    external: true
